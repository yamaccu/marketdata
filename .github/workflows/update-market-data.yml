name: Update market data

on:
  workflow_dispatch:

  schedule:
    - cron: "15 17 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを読み込む
        uses: actions/checkout@v7

      - name: Pythonを準備する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 必要なライブラリをインストールする
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 市場データを取得する
        run: python fetch_data.py

      - name: CSVの変更をGitHubへ保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "CSVに変更はありません"
          else
            git commit -m "Update market data"

            for attempt in 1 2 3 4 5; do
              echo "git pushを試行します ($attempt/5)"

              if git push; then
                echo "git pushに成功しました"
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "git pushが5回失敗しました"
                exit 1
              fi

              echo "10秒後に再試行します"
              sleep 10
            done
          fi
